<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img src="images/weather-app.png" alt="" width="30" height="24" class="d-inline-block align-text-top">
            Weather Tracker
        </a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3">zhukovsd</span>
            <form th:action="@{/sign-out}" method="post">
                <button type="submit" class="btn btn-outline-danger">
                    Sign out
                </button>
            </form>
        </div>
    </div>
</nav>

<section id="page-content">
    <div class="container mt-4">
        <form th:action="@{/search-results}" method="get" class="d-flex my-4">
            <div class="input-group location-search-input-group me-3">
                <input class="form-control"
                       type="text"
                       name="location"
                       placeholder="Введите локацию ">

                <button class="btn btn-outline-secondary btn-sm clear-input-button"
                        type="button"
                        onclick="this.previousElementSibling.value=''">
                    &times;
                </button>
            </div>

            <button class="btn btn-outline-success" type="submit">
                Search
            </button>
        </form>
    </div>

    <div class="container">
        <h2>Locations:</h2>

        <div class="row">
            <div class="col-12 col-lg-3 col-md-6 mb-4"
                 th:each="location : ${weatherResponses}">

                <div class="card h-100">
                    <form th:action="@{/home/delete}" method="post" class="d-flex my-4">
                        <button class="btn-close" aria-label="Delete"></button>
                        <div class="card-body d-flex flex-column">
                            <img th:src="|https://openweathermap.org/img/wn/${weatherResponse.weather.icon}@2x.png|"
                                 class="weather-icon"
                            >

                            <h5 class="card-title"
                                th:text="${location.name}">
                                Location name
                            </h5>

                            <p class="card-text mb-1">
                                Feels like:
                                <span th:text="${location.weatherMeasurements.feelsLike}">0</span>
                            </p>

                            <p class="card-text mb-1">
                                Humidity:
                                <span th:text="|${location.weatherMeasurements.humidity}%|">0</span>
                            </p>

                            <p class="card-text mb-1">
                                Latitude:
                                <span th:text="${location.latitude}">0</span>
                            </p>

                            <p class="card-text mb-1">
                                Longitude:
                                <span th:text="${location.longitude}">0</span>
                            </p>

<!--                            <input type="hidden"-->
<!--                                   name="name"-->
<!--                                   th:value="${location.name}">-->

<!--                            <input type="hidden"-->
<!--                                   name="lat"-->
<!--                                   th:value="${location.latitude}">-->

<!--                            <input type="hidden"-->
<!--                                   name="lon"-->
<!--                                   th:value="${location.longitude}">-->
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <p th:if="${#lists.isEmpty(weatherResponses)}">
            No locations found.
        </p>
    </div>
</section>


<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
        <span>© Weather Viewer, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a> roadmap.</span>
    </div>
</footer>

</body>
</html>
