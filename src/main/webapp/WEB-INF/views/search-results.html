<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Search results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

<nav class="navbar navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img th:src="@{/static/images/weather-app.png}"
                 alt=""
                 width="30"
                 height="24"
                 class="d-inline-block align-text-top">
            Weather Tracker
        </a>
        <div class="d-flex align-items-center">
            <span class="navbar-text me-3">zhukovsd</span>
            <form th:action="@{/sign-out}" method="post">
                <button type="submit" class="btn btn-outline-danger">
                    Sign out
                </button>
            </form>
        </div>
    </div>
</nav>

<section id="page-content">
        <div class="container mt-4">
            <form th:action="@{/search-results}" method="get" class="my-4">

                <div class="d-flex">
                    <div class="input-group location-search-input-group me-3">
                        <input class="form-control"
                               type="text"
                               name="location"
                               placeholder="Введите локацию">

                        <button class="btn btn-outline-secondary btn-sm clear-input-button"
                                type="button"
                                onclick="this.previousElementSibling.value=''">
                            &times;
                        </button>
                    </div>

                    <button class="btn btn-outline-success" type="submit">
                        Search
                    </button>
                </div>

                <div class="text-danger mt-1"
                     th:if="${validationError}">
                    Используйте только латиницу
                </div>

                <div class="text-danger mt-1"
                     th:if="${locationAlreadyExists}">
                    Такая локация была уже добавлена
                </div>

            </form>
        </div>

    <div class="container"
         th:if="!${validationError}">

        <h2>Locations:</h2>

        <div class="row">
            <div class="col-12 col-lg-3 col-md-6 mb-4"
                 th:each="location : ${locations}">

                <div class="card h-100">
                    <div class="card-body d-flex flex-column">
                        <form th:action="@{/search-results/add}" method="post">

                            <h5 th:text="${location.name}">Kazan</h5>

                            <p>
                                Latitude:
                                <span th:text="${location.lat}"></span>
                            </p>

                            <p>
                                Longitude:
                                <span th:text="${location.lon}"></span>
                            </p>

                            <p>
                                Country:
                                <span th:text="${location.country}"></span>
                            </p>

                            <p>
                                State:
                                <span th:text="${location.state}"></span>
                            </p>

                            <input type="hidden"
                                   name="name"
                                   th:value="${location.name}">

                            <input type="hidden"
                                   name="lat"
                                   th:value="${location.lat}">

                            <input type="hidden"
                                   name="lon"
                                   th:value="${location.lon}">

                            <input type="hidden"
                                   name="country"
                                   th:value="${location.country}">

                            <input type="hidden"
                                   name="state"
                                   th:value="${location.state}">

                            <button type="submit" class="btn btn-primary w-100">
                                Add
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>

        <p th:if="${#lists.isEmpty(locations)}">
            No locations found.
        </p>
    </div>
</section>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
        <span>© Weather Viewer, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a> roadmap.</span>
    </div>
</footer>

</body>
</html>
